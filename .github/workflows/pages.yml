name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The CLI build emits the whole site: index.html, the spec copy, both
      # client bundles, any bundled logo/favicon assets, and — because the
      # demo config opts in via features.configBuilder — the builder page at
      # config-builder/index.html.
      - run: node dist/cli.js build --config demo/periwinkle.config.mjs --out site
      # Publish the icon picker next to the demo so it can be used straight
      # from the browser. Linking the file in the repository would only show
      # its source, and the page is self-contained anyway.
      - run: cp tools/icon-picker.html site/icon-picker.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
