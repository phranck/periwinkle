name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The CLI build emits the whole site: index.html, the integrated
      # config-builder.html (with the shared periwinkle top nav), both
      # client bundles, and any bundled logo/favicon assets. No extra
      # copy step — copying the standalone root config-builder.html here
      # would overwrite the generated, integrated one.
      - run: node dist/cli.js build --config demo/periwinkle.config.mjs --out site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
